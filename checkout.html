{% extends 'cafe/base.html' %}{% block content %}<section class="wrap narrow"><h1>Checkout</h1><p>Total payable: <strong>₹{{ total }}</strong></p><form class="form-card" method="post">{% csrf_token %}<label>Name<input name="name" maxlength="120" required value="{{ user.username }}"></label><label>Phone<input name="phone" type="tel" maxlength="15" pattern="[0-9+ -]{10,15}" required placeholder="10-digit phone"></label><label>Order type<select name="order_type"><option value="takeaway">Takeaway / Pickup</option><option value="dinein">Dine in</option></select></label><label>Payment method<select name="payment_method"><option value="cash">Pay at Cafe</option>{% if razorpay_enabled %}<option value="razorpay">Razorpay online (test/live as configured)</option>{% endif %}</select></label><label>Special instructions<textarea name="notes" maxlength="1000" rows="3" placeholder="Less sugar, no ice..."></textarea></label><button class="btn" type="submit">Confirm order · ₹{{ total }}</button><p class="hint">Orders are stored in the database. Online payment is optional; for Razorpay, finish payment from My Orders after confirming.</p></form></section>{% endblock %}
